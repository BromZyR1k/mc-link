<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MC-бот</title>
<style>body{font:16px system-ui,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;color:#888;text-align:center;padding:16px}</style></head>
<body><div id="m">Подключаюсь к боту…</div>
<script>
// Постоянная страница-переходник. Бот пишет свой текущий адрес в url.txt этого же репозитория.
// Владелец и репозиторий берутся из адреса страницы (твойник.github.io/репозиторий/) — править ничего не нужно.
var owner = location.hostname.split('.')[0];
var repo = location.pathname.split('/').filter(Boolean)[0] || (owner + '.github.io');
var REPO = owner + '/' + repo, FILE = 'url.txt';
// Где лежит текущий адрес бота (url.txt): API GitHub (свежий, но лимит 60 запросов/час — даёт 403), raw.githubusercontent
// и сам сайт Pages (без лимитов, но обновляется с задержкой). Берём все, проверяем, какой туннель жив, и идём туда.
var T = Date.now();
var SOURCES = [
  ['https://api.github.com/repos/' + REPO + '/contents/' + FILE, { Accept: 'application/vnd.github.raw' }],
  ['https://raw.githubusercontent.com/' + REPO + '/main/' + FILE + '?t=' + T, {}],
  [location.origin + '/' + repo + '/' + FILE + '?t=' + T, {}],
];
var RE = /https:\/\/[a-z0-9-]+\.trycloudflare\.com/;
function withTimeout(p, ms) { return Promise.race([p, new Promise(function (_, rej) { setTimeout(function () { rej(new Error('таймаут')); }, ms); })]); }
function read(src) {
  return withTimeout(fetch(src[0], { headers: src[1], cache: 'no-store' }), 6000)
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (t) { var m = RE.exec(t); if (!m || /^https:\/\/api\./.test(m[0])) throw new Error('пусто'); return m[0]; });
}
// жив ли туннель: мёртвый адрес trycloudflare не находится в DNS — запрос падает сразу
function alive(u) { return withTimeout(fetch(u + '/?ping=' + T, { mode: 'no-cors', cache: 'no-store' }), 5000).then(function () { return u; }); }
var errs = [];
Promise.all(SOURCES.map(function (s) { return read(s).catch(function (e) { errs.push(e.message); return null; }); }))
  .then(function (list) {
    var uniq = list.filter(function (u, i) { return u && list.indexOf(u) === i; });
    if (!uniq.length) throw new Error(errs.join(', ') || 'нет адреса');
    var i = 0;
    function next() {
      if (i >= uniq.length) return Promise.reject(new Error('туннель не отвечает'));
      return alive(uniq[i++]).catch(next);
    }
    return next();
  })
  .then(function (u) {
    document.getElementById('m').textContent = 'Открываю…';
    // hash (tgWebAppData…) сохраняем — Telegram передаёт в нём данные запуска
    location.replace(u + '/' + location.search + location.hash);
  })
  .catch(function (e) { document.getElementById('m').innerHTML = 'Бот сейчас не в сети (' + e.message + ').<br>Запусти бота, подожди ~30 секунд и открой снова.<br><br><button onclick="location.reload()" style="font:inherit;padding:8px 16px">Повторить</button>'; });
</script></body></html>
